name: Sync GitHub & LeetCode activity

on:
  schedule:
    # Every 6 hours — keeps LeetCode + repo cache fresh
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/sync-activity.mjs'
      - '.github/workflows/sync-activity.yml'

permissions:
  contents: write

concurrency:
  group: sync-activity
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync activity data
        run: node scripts/sync-activity.mjs

      - name: Commit updated activity.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/activity.json
          if git diff --staged --quiet; then
            echo "No activity changes"
          else
            git commit -m "chore: sync GitHub and LeetCode activity"
            git push
          fi
